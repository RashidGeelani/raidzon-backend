raidzon:
  auth:
    widget-enabled: ${RAIDZON_WIDGET_ENABLED:false}
    pepper: ${RAIDZON_AUTH_PEPPER:}

  sms:
    provider: ${RAIDZON_SMS_PROVIDER:disabled}
    msg91:
      auth-key: ${RAIDZON_MSG91_AUTH_KEY:}
      template-id: ${RAIDZON_MSG91_TEMPLATE_ID:}

  database:
    url: ${RAIDZON_DATABASE_URL}
    username: ${RAIDZON_DATABASE_USERNAME}
    password: ${RAIDZON_DATABASE_PASSWORD}
    pool-size: ${RAIDZON_DATABASE_POOL_SIZE:3}

  # Optional. Off: one instance, every read hits Postgres. On: live views are cached in Redis and
  # WebSocket updates fan out through Redis pub/sub, so several instances can serve watchers.
  redis:
    enabled: ${RAIDZON_REDIS_ENABLED:false}

spring:
  data:
    redis:
      url: ${RAIDZON_REDIS_URL:redis://127.0.0.1:6379}
      timeout: 500ms
      connect-timeout: 1s

  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    url: ${RAIDZON_DATABASE_URL}
    username: ${RAIDZON_DATABASE_USERNAME}
    password: ${RAIDZON_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format-sql: true


