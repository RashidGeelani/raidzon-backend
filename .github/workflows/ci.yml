name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raidzon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      RAIDZON_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/raidzon_test
      RAIDZON_TEST_DATABASE_USERNAME: postgres
      RAIDZON_TEST_DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          path: raidzonbackend
      - uses: actions/checkout@v4
        with:
          repository: RashidGeelani/raidzon-test-fixtures
          path: test-fixtures
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: raidzonbackend/pom.xml
      - name: Tests
        working-directory: raidzonbackend
        run: mvn -B -ntp -s maven-settings.xml test
      - name: Docker image builds
        working-directory: raidzonbackend
        run: docker build -t raidzon-backend-ci .
